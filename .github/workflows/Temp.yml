name: Temp
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: mwh/dragon
          fetch-depth: 1
      - name: Build
        shell: bash
        run: |
          sudo apt update
          sudo apt install libfontconfig1-dev libgtk-3-dev
          CFLAGS='-O3' make -j2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Result.zip
          path: dragon
          include-hidden-files: true
