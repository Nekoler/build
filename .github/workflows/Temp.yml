name: Temp
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: sadlavaarsc/iris
          fetch-depth: 1
      - name: Build
        shell: bash
        run: |
          cargo build --release
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Result.zip
          path: target
          include-hidden-files: true
